[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interflib"
version = "0.1.0"
description = "Analysis library for the INM interferometry project"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Sebastian" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "nbstripout>=0.6", "ruff>=0.5"]
notebooks = ["scikit-image>=0.21"]
tools = ["pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["interflib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Errors and likely bugs; long lines and spacing style are not enforced.
select = ["F", "B", "E9", "E70", "W291", "W292", "W293"]
